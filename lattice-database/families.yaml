# Every family that a lattice may name, with one sentence of its meaning.
diagonal: 'The basis is orthogonal: $b(e_i, e_j) = 0$ for $i \neq j$. For example $\langle a \rangle$ and $\mathrm{I}_{p,q}$.'
irreducible-root-lattice: An irreducible root lattice $A_n$, $D_n$, $E_6$, $E_7$ or $E_8$, in the basis of its simple roots.
root-lattice-sum: An orthogonal sum of two or more root lattices $A_n$, $D_n$, $E_6$, $E_7$, $E_8$, in the union of their bases of simple roots.
dual-root-lattice: The dual lattice $R^*$ of a root lattice $R$, in the basis of fundamental weights, dual to the basis of simple roots of $R$.
affine-root-lattice: 'The lattice of an affine root system $\widetilde{A}_n$, $\widetilde{D}_n$, $\widetilde{E}_6$, $\widetilde{E}_7$ or $\widetilde{E}_8$ in the basis of its simple roots: positive semidefinite, with a radical of rank 1.'
even-unimodular: 'Even and unimodular: an orthogonal sum $U^{s} \oplus E_8(-1)^{t}$ with $s \geq 1$, of signature $(s, s + 8t)$.'
r-plus-a-22: An even hyperbolic 2-elementary lattice with Nikulin's invariants $(r, a, \delta)$ and $r + a = 22$. Nikulin classifies these lattices (J. Soviet Math. 22 (1983), DOI 10.1007/BF01094757, Table 1); Theorem 1.1 of Alexeev, arXiv:2209.09110, decides which of them are reflective.
laminated: A laminated lattice $\Lambda_n$ of Conway and Sloane, in the basis of its entry of the Catalogue of Lattices.
nebe-sloane-catalogue: An entry of the Catalogue of Lattices of G. Nebe and N. J. A. Sloane, with the Gram tensor as the entry states it.
nikulin-two-elementary: 'An even hyperbolic lattice $L$ with $2 A_L = 0$ of signature $(1, r - 1)$, named by Nikulin''s invariants $(r, a, \delta)$: one of the 75 invariant lattices of the nonsymplectic involutions of K3 surfaces in Table 1 of Nikulin, J. Soviet Math. 22 (1983), DOI 10.1007/BF01094757. The 13 with $a = r$ are the twists $M(2)$ of unimodular lattices $M$, and they are the only twists that the corpus records.'
beauville-bogomolov: $H^2(Y, \mathbb{Z})$ with the Beauville-Bogomolov form, for $Y$ an irreducible holomorphic symplectic variety of one of the known deformation types $S^{[n]}$, $K_n(T)$, OG6, OG10, as the table of the introduction of Rapagnetta, arXiv:math/0606409, states it.
polarized-k3: The lattice $L_{2d} \cong U^2 \oplus E_8(-1)^2 \oplus \langle -2d \rangle$, the orthogonal complement in $\mathrm{II}_{3,19}$ of a primitive vector $h$ with $b(h, h) = 2d$; the period domain of K3 surfaces with a polarization of degree $2d$ is defined from it.
niemeier: "An even unimodular positive definite lattice of rank 24: one of the 24 lattices of Niemeier's classification, named by its root system; the Leech lattice is the one with no roots."
k3-symplectic-invariant: 'A lattice $M$ such that $M(k)$, for a nonzero integer $k$, is the invariant lattice $\Lambda^G$ of a finite group $G$ of symplectic isometries of the K3 lattice $\Lambda = \mathrm{II}_{3,19}$: a row of Table 10.3 of K. Hashimoto, arXiv:1012.2682.'
k3-symplectic-coinvariant: 'The lattice $\Lambda_G(-1)$, for the coinvariant lattice $\Lambda_G = (\Lambda^G)^\perp$, negative definite, of a finite group $G$ of symplectic isometries of the K3 lattice $\Lambda = \mathrm{II}_{3,19}$: a row of Table 10.2 of K. Hashimoto, arXiv:1012.2682.'
