[tool:pytest]
# Pytest configuration for Coxeter test suite following best practices

# Test discovery
testpaths = unit integration system sage_verification
python_files = test_*.py test_*.sage
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    -ra

# Custom markers for proper test organization
markers =
    # Test type markers (primary classification)
    unit: Unit tests of our implementation (fast, isolated)
    integration: Integration tests between components (medium speed)
    system: System/end-to-end tests (slow, comprehensive)
    sage: Sage verification tests (requires Sage installation)
    benchmark: Performance and complexity benchmarks (very slow)
    
    # Speed markers for filtering
    fast: Fast tests (< 1 second)
    medium: Medium speed tests (1-10 seconds)
    slow: Slow tests (10-60 seconds)
    very_slow: Very slow tests (> 60 seconds, typically benchmarks)
    
    # Mathematical content markers
    gram_matrices: Tests related to Gram matrices
    root_systems: Tests related to root systems and lattices
    coxeter_groups: Tests related to Coxeter group theory
    weyl_groups: Tests related to Weyl groups and chamber theory
    dynkin_diagrams: Tests related to Dynkin diagram classification
    hyperbolic: Tests related to hyperbolic/indefinite Coxeter groups
    crystallographic: Tests related to crystallographic classification
    homological: Tests related to group homology and cohomology
    computational: Tests related to computational group theory
    automatic_groups: Tests related to automatic group properties
    
    # Coxeter type markers
    finite: Tests for finite Coxeter groups
    affine: Tests for affine Coxeter groups  
    indefinite: Tests for indefinite/hyperbolic Coxeter groups
    
    # Mathematical series markers
    classical: Tests for classical types (A, B, C, D)
    exceptional: Tests for exceptional types (E, F, G)
    dihedral: Tests for dihedral groups I2(m)
    icosahedral: Tests for icosahedral groups (H series)
    
    # Source and methodology markers
    literature: Tests based on literature examples
    tdd: Test-driven development tests (our implementations)
    wikiwand: Tests based on Wikiwand articles
    wikipedia: Tests based on Wikipedia articles
    bourbaki: Tests following Bourbaki conventions
    
    # Implementation status markers
    implemented: Tests for implemented functionality
    not_implemented: Tests for not-yet-implemented functionality (expected to fail)
    regression: Regression tests for previously fixed bugs
    
    # Dependency markers
    no_sage: Tests that don't require Sage
    requires_sage: Tests that require Sage installation
    requires_internet: Tests that require internet connection
    
    # Complexity markers for development workflow
    simple: Simple tests (basic functionality)
    complex: Complex tests (advanced mathematical properties)
    edge_case: Edge case and boundary condition tests

# Minimum version requirements
minversion = 6.0

# Test collection timeout (5 minutes)
timeout = 300

# Filterwarnings - suppress known Sage warnings
filterwarnings =
    ignore::DeprecationWarning:sage.*
    ignore::PendingDeprecationWarning:sage.*
    ignore::RuntimeWarning:sage.*
    ignore::UserWarning:sage.*
    # Ignore specific warnings that are common in mathematical computing
    ignore:.*invalid value encountered.*:RuntimeWarning
    ignore:.*divide by zero encountered.*:RuntimeWarning

# Test directories configured above in test discovery section

# Parallel execution settings (if pytest-xdist is installed)
# addopts = -n auto

# Coverage configuration (if using pytest-cov)
[coverage:run]
source = ../src
omit = 
    */tests/*
    */test_*
    */fixtures/*
    */benchmarks/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod
    # Don't complain about debug-only code
    def __debug__
    # Don't complain about type checking imports
    if TYPE_CHECKING: