[project]
name = "dzack-research-preamble"
version = "0.0.10"
description = "SageMath preamble: categorical foundations for lattice research"
requires-python = ">=3.14"
# sagepython (the compiler core) is sage-free and needs only these;
# preparser (the Sage-session surface) additionally needs a Sage runtime.
dependencies = [
    "tree-sitter",
    "tree-sitter-sage @ git+https://github.com/dzackgarza/tree-sitter-sage",
]

# Requirements installed into the uvx mypy environment so static analysis can
# resolve imports (see ai-review-ci justfiles/sage.just, _sage-mypy). Nothing
# in the preamble imports the archived spike, so it is not pinned here. PyPI
# names resolve from the index.
[dependency-groups]
dev = [
    "networkx",
    "types-networkx",
    "ipython",
    # The preparser compiles Sage source over the tree-sitter-sage grammar.
    "tree-sitter",
    "tree-sitter-sage @ git+https://github.com/dzackgarza/tree-sitter-sage",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# The preamble is a PEP 420 namespace package: dzack_research.preamble maps to
# this directory.
# Subpackages are the categories tree; there are no __init__.py files.
[tool.setuptools]
package-dir = { "dzack_research.preamble" = "." }
packages = [
    "dzack_research.preamble",
    "dzack_research.preamble.categories",
    "dzack_research.preamble.categories.abstract_categories",
    "dzack_research.preamble.categories.algebras",
    "dzack_research.preamble.categories.divisors",
    "dzack_research.preamble.categories.forms",
    "dzack_research.preamble.categories.group",
    "dzack_research.preamble.categories.modules",
    "dzack_research.preamble.categories.modules.framed",
    "dzack_research.preamble.categories.modules.framed.formed",
    "dzack_research.preamble.categories.modules.framed.formed.integrallattice",
    "dzack_research.preamble.categories.modules.framed.formed.torsionform",
    "dzack_research.preamble.categories.modules.framed.finitely_generated",
    "dzack_research.preamble.categories.functors",
    "dzack_research.preamble.categories.modules.group_modules",
    "dzack_research.preamble.categories.modules.module_morphisms",
    "dzack_research.preamble.categories.modules.pure",
    "dzack_research.preamble.categories.modules.pure.finitely_generated",
    "dzack_research.preamble.categories.schemes",
    "dzack_research.preamble.categories.sets",
    "dzack_research.preamble.lexicon",
]
