<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Category and functor graph</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
    #vp { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
    #vp.grabbing { cursor: grabbing; }
    #world { transform-origin: 0 0; }
    #world svg { display: block; max-width: none; height: auto; }
    #hint {
      position: fixed;
      left: 10px;
      bottom: 10px;
      padding: 4px 8px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: rgb(255 255 255 / 90%);
      color: #6b7280;
      font-size: 12px;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0b0f19; }
      #hint { border-color: #374151; background: rgb(17 24 39 / 90%); color: #9ca3af; }
    }
  </style>
</head>
<body>
  <div id="vp"><div id="world">%SVG%</div></div>
  <div id="hint">scroll to zoom &middot; drag to pan</div>
  <script>
    (() => {
      const viewport = document.getElementById("vp");
      const world = document.getElementById("world");
      let scale = 1;
      let x = 20;
      let y = 20;
      let dragging = false;
      let previousX = 0;
      let previousY = 0;

      const apply = () => {
        world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      };

      window.addEventListener("load", () => {
        const svg = world.querySelector("svg");
        if (svg === null) throw new Error("generated category graph has no SVG element");
        const box = svg.getBoundingClientRect();
        const fit = Math.min(viewport.clientWidth / box.width, viewport.clientHeight / box.height) * 0.95;
        scale = viewport.clientWidth < 600 ? Math.max(fit, 0.65) : fit;
        x = scale > fit ? 20 : (viewport.clientWidth - box.width * scale) / 2;
        y = 20;
        apply();
      });

      viewport.addEventListener("wheel", (event) => {
        event.preventDefault();
        const factor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
        const rect = viewport.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;
        x = mouseX - (mouseX - x) * factor;
        y = mouseY - (mouseY - y) * factor;
        scale *= factor;
        apply();
      }, { passive: false });

      viewport.addEventListener("pointerdown", (event) => {
        dragging = true;
        previousX = event.clientX;
        previousY = event.clientY;
        viewport.classList.add("grabbing");
        viewport.setPointerCapture(event.pointerId);
      });
      viewport.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        x += event.clientX - previousX;
        y += event.clientY - previousY;
        previousX = event.clientX;
        previousY = event.clientY;
        apply();
      });
      viewport.addEventListener("pointerup", () => {
        dragging = false;
        viewport.classList.remove("grabbing");
      });

      apply();
    })();
  </script>
</body>
</html>
