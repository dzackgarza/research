# This directory is the Quarto project root and holds nothing but build
# machinery. The prose lives one level up; each part of the book is symlinked
# in beside this file (index.md, category-theory, lattice-theory, coble, data),
# so the project root exposes the same chapter tree that the book configuration
# names below.
# The writing that is not site content -- the dissertation, which builds through
# ~/.pandoc, plus the talks, exams and research statement -- is simply not
# linked in, which is why no render-exclusion list appears below.
project:
  type: book
  output-dir: _site
  # `resources:` is unused here. A directory entry is collected by a walk that does not
  # descend a symlink, and every part reaches this directory as one, so it silently
  # copies nothing; a single file that is itself a symlink is copied *as a symlink*,
  # which lands dangling in _site and then collides with itself on the second render
  # pass. Everything the site needs is copied by the post-render step instead.
  post-render:
    - .assets/copy-resources.sh
book:
  title: Writing
  repo-url: https://github.com/dzackgarza/research
  site-url: https://dzackgarza.github.io/research/
  search: true
  sidebar:
    collapse-level: 1
  # Two levels is all a book sidebar has: parts, then chapters. A nested `part:`
  # fails schema validation and `book.sidebar.contents` is accepted and then
  # ignored -- see TRAPS.md. So the parts below carry the whole tree, and each one
  # is a run the part's own landing page already names.
  #
  # This list is the book's reading order, and it is the only place that order is
  # written down. A chapter's position is a claim about its mathematics: that
  # everything it uses is defined above it, and that the part it sits in names the
  # subject it is about. So a new page is placed by reading it -- never by
  # appending to a part or inserting beside a similar filename. Filename order is
  # unrelated to dependency order, and here it once produced the exact reverse of
  # it. See writing/coble/AGENTS.md, "Where a new chapter goes".
  chapters:
    - index.md
    # Part 1. The landing page heads its own first group. Order is
    # definition-before-use: classifiers are needed by both limits and monoidal
    # structure, so truncation precedes them.
    - part: category-theory/index.md
      chapters:
        - category-theory/framework/Higher-Categories-and-Universes.md
        - category-theory/framework/Categorical-Foundations.md
        - category-theory/framework/Truncation-and-Classifiers.md
        - category-theory/framework/Limits-and-Colimits.md
        - category-theory/framework/Loops-and-Suspension.md
        - category-theory/framework/Identification.md
        - category-theory/framework/Equality.md
    - part: Algebraic structure
      chapters:
        - category-theory/framework/Mathematical-Framework.md
        - category-theory/framework/Monoidal-Categories.md
        - category-theory/framework/Modules-and-Forms.md
        - category-theory/framework/Generators-and-Presentations.md
        - category-theory/framework/Joins-Meets-and-Closure.md
        - category-theory/framework/Distinguished-Functors.md
        - category-theory/framework/Elements-and-Containment.md
        - category-theory/framework/Generic-Elements.md
    # One dependency chain, in its own order: forms, then Witt theory and the
    # stable/morphism constructions built on it. Lattice theory has its own part
    # below rather than being mixed into this categorical framework.
    - part: Forms and Witt theory
      chapters:
        - category-theory/framework/Bilinear-and-Quadratic-Forms.md
        - category-theory/framework/Bilinear-Forms-on-Algebra-Modules.md
        - category-theory/framework/Hyperbolic-Forms-and-Witt-Classes.md
        - category-theory/framework/Stable-Categories-of-Modules-with-Duality.md
        - category-theory/framework/Morphisms-of-Form-Modules.md
        - category-theory/framework/Chain-Complexes.md
    - part: Reference
      chapters:
        - category-theory/framework/Mathematical-Sources.md
    # Part 2. The geometry the paper starts from: the three surface classes, then
    # the K3 cover that carries every lattice-theoretic statement later.
    - part: coble/index.md
      chapters:
        - coble/introduction/000-introduction.md
        - coble/surfaces-and-moduli/surface-types.md
        - coble/surfaces-and-moduli/k3-covers-and-involutions.md
        - coble/surfaces-and-moduli/polarizations-and-loci.md
        - coble/coble-surfaces/coble-surface-basics.md
        - coble/coble-surfaces/k3-covers-of-coble-surfaces.md
        - coble/coble-moduli/coble-surface-structure-and-classification.md
        - coble/coble-surfaces/rational-sextic-calculations.md
    # General lattice machinery, complete before any Coble-specific lattice is
    # named. Splitting this from the next part is what keeps either readable.
    - part: Lattice theory
      chapters:
        - lattice-theory/Lattices-and-Discriminant-Forms.md
        - lattice-theory/arithmetic/clifford-lifting-and-spinor-obstructions.md
        - lattice-theory/Isometries-and-Arithmetic-Invariants.md
        - lattice-theory/lattice-theory.md
        - lattice-theory/root-systems.md
        - lattice-theory/Coxeter-Systems-and-Lattices.md
        - lattice-theory/discriminant-forms-and-genus.md
        - lattice-theory/embeddings-and-overlattices.md
        - lattice-theory/automorphism-lifting-through-a-gluing.md
        - lattice-theory/special-lattices-and-transformations.md
        - lattice-theory/invariant-and-coinvariant-lattices.md
    # This project's own arithmetic, in dependency order: the discriminant orbits
    # are what the Heegner line is cut out of, and the lifting criterion is stated
    # for the arithmetic group that chapter constructs.
    - part: The Coble lattice
      chapters:
        - coble/lattices-and-moduli/special-lattices.md
        - coble/lattices-and-moduli/discriminant-orbits-of-the-coble-lattice.md
        - coble/lattices-and-moduli/the-heegner-line-and-the-coble-arithmetic-group.md
        - coble/lattices-and-moduli/coble-lattice-table.md
        - coble/lattices-and-moduli/nodal-enriques-lattices.md
    - part: Moduli spaces and period domains
      chapters:
        - coble/lattices-and-moduli/k3-periods-and-monodromy.md
        - coble/lattices-and-moduli/coble-moduli-basics.md
        - coble/lattices-and-moduli/moduli-construction.md
        - coble/lattices-and-moduli/lattices.md
    - part: Reflection groups and compactifications
      chapters:
        - coble/compactifications/reflection-groups-and-vinberg.md
        - coble/compactifications/coxeter-systems-and-classification.md
        - coble/compactifications/dynkin-foldings.md
        - coble/compactifications/hyperbolic-coxeter-polytopes.md
        - coble/compactifications/reflective-two-elementary-lattices.md
        - coble/compactifications/toroidal-and-semitoroidal.md
        - coble/compactifications/scattone-cusp-method.md
    - part: Degenerations
      chapters:
        - coble/degenerations/kulikov-models.md
        - coble/degenerations/anticanonical-pairs-and-singularities.md
        - coble/degenerations/divisor-and-dlt-models.md
        - coble/degenerations/halphen-surfaces.md
        - coble/degenerations/morrison-flowerpot-degenerations.md
    # The algorithm, then the diagrams it produces for each moduli space, then the
    # correspondence between them -- which runs Enriques to Coble, the direction the
    # mirror moves go.
    - part: The cusp correspondence
      chapters:
        - coble/cusp-correspondence/cusp-diagram-calculations.md
        - coble/cusp-correspondence/cusp-diagrams-by-moduli-space.md
        - coble/cusp-correspondence/enriques-to-coble-cusp-correspondence.md
    - part: Stable limits
      chapters:
        - coble/stable-limits/geometric.md
        - coble/stable-limits/ias.md
        - coble/stable-limits/ksba.md
    - part: 'Results for $F_{\mathrm{En},2}$'
      chapters:
        - coble/results-f-en-2/main-theorem-and-cusps.md
        - coble/results-f-en-2/ksba-semitoroidal-comparison.md
        - coble/results-f-en-2/classifying-map-and-involution.md
    # The split below is the one the pages declare themselves, in their own
    # `unit:` frontmatter: reusable method, then the results it produced.
    - part: Computational methods
      chapters:
        - coble/computations/computational-toolchain-and-recipe.md
        - coble/computations/lattice-algorithms-by-signature.md
        - coble/computations/fundamental-chamber-polyhedra.md
        - coble/computations/isotropic-orbits-and-tits-buildings.md
        - coble/computations/periods-and-local-monodromy.md
    - part: Computed results
      chapters:
        - coble/computations/coxiter-results-for-cusp-lattices.md
        - coble/computations/root-vectors-and-folded-sterk-diagrams.md
        - coble/computations/sterk-root-counts-and-computed-chambers.md
        - coble/computations/sterk-integral-affine-data.md
        - coble/computations/coble-lattice-isotropic-candidates.md
    # Everything still conjectural, together: the pages below all carry
    # `status: conjectural`, and a reader is owed that boundary in the structure.
    - part: Open problems and research programs
      chapters:
        - coble/open-problems/open-problems.md
        - coble/coble-moduli/coble-families-research-program.md
        - coble/coble-moduli/cusp-correspondence-morphism-chain.md
        - coble/adjacent-programs/nodal-enriques-moduli-program.md
        - coble/adjacent-programs/halphen-index-2-moduli-program.md
        - coble/heegner-report/coble-heegner-research-report.md
    # Back matter. coble/tables/*.md are untitled fragments, not chapters: they
    # are pulled into the Diagrams page by include, which is why they no longer
    # appear as blank entries in the sidebar.
    - part: Reference
      chapters:
        - coble/appendix-reference/adjunction-and-ramification-formulae.md
        - coble/appendix-reference/coxeter-and-dynkin-diagrams.md
        - coble/reference-tables/lattice-and-diagram-conventions.md
        - coble/extracted-references/extracted-references.md
# Assets that pandoc, rather than Quarto, opens must live in .assets/ -- see the
# note beside `filters:` below. The two Coble bibliographies need no such
# treatment: they sit inside a symlinked part, so both tools reach them the same way.
bibliography:
  - .assets/references.bib
  - .assets/refs-web.bib
  - coble/coble_supplement.bib
  - coble/heegner-report/coble_references.bib
link-citations: true
number-sections: true
crossref:
  chapters: true
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    html-math-method: mathjax
    code-copy: true
    smooth-scroll: true
    css: tikz-diagrams.css
    include-in-header: .assets/mathjax-order.html
    include-before-body: .assets/mathjax-macros.html
# Quarto resolves a project-relative path against this directory, but pandoc runs
# with its working directory at the *real* location of the input, and the parts are
# symlinked in from writing/ -- so every such path lands one level above this
# directory, whatever the input's depth. Two consequences, both load-bearing:
#
#   * Filters are named, never given as a path. A bare `*.lua` path misses by that
#     hop; an extension filter is resolved by name and is immune, so the two local
#     filters are packaged under _extensions/local/.
#   * Anything pandoc itself opens (the bibliographies, the header includes) lives
#     in .assets/, which is physically writing/.assets and reached from here through
#     a symlink. Both tools then find it: Quarto through the symlink, pandoc at the
#     place its relative path actually lands. Quarto-side assets such as the
#     stylesheet need none of this and stay beside this file.
filters:
  - book-toc
  - amsthm-refs
  - amsthm-divs
  - custom-numbered-blocks
  - stacks-tags
  - pandoc-tikzcd
  - tikz
tikz:
  cache: true
  svg-engine: pdftocairo
# Numbered amsthm-style environments (custom-numbered-blocks, the dzackgarza fork that
# keeps one registry at the project root for chapters in any directory).
# One shared per-chapter counter (all kinds in group blocks): a block is Kind N.M in one sequence;
# quartothmlike appearance mimics native Quarto theorems.
# The syntax is the one the pandoc papers use (the amsenv filter, convert_amsthm_envs.lua):
#   ::: {.theorem #thm:key title="Optional title"} ... :::
#   @thm:key or [@thm:key] -> Theorem 2.9;  [-@thm:key] -> 2.9  (amsthm-refs rewrites these for cnb).
# Ids use a colon after the family prefix, so they never collide with the Quarto-reserved thm-/def-/... prefixes.
custom-numbered-blocks:
  appearances:
    thmlike:
      container: quartothmlike
  groups:
    blocks:
      appearance: thmlike
  classes:
    theorem:
      group: blocks
      label: Theorem
    lemma:
      group: blocks
      label: Lemma
    corollary:
      group: blocks
      label: Corollary
    proposition:
      group: blocks
      label: Proposition
    conjecture:
      group: blocks
      label: Conjecture
    definition:
      group: blocks
      label: Definition
    example:
      group: blocks
      label: Example
    construction:
      group: blocks
      label: Construction
    notation:
      group: blocks
      label: Notation
    convention:
      group: blocks
      label: Convention
    exercise:
      group: blocks
      label: Exercise
    problem:
      group: blocks
      label: Problem
    question:
      group: blocks
      label: Question
    remark:
      group: blocks
      label: Remark
    warning:
      group: blocks
      label: Warning
    observation:
      group: blocks
      label: Observation
    note:
      group: blocks
      label: Note
    claim:
      group: blocks
      label: Claim
    assumption:
      group: blocks
      label: Assumption
