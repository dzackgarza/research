# Assets that pandoc, rather than Quarto, opens must live in .assets/ -- see the
# note beside `filters:` below. The two Coble bibliographies need no such
# treatment: they sit inside a symlinked part, so both tools reach them the same way.
bibliography:
  - .assets/references.bib
  - .assets/refs-web.bib
  - coble/coble_supplement.bib
  - coble/heegner-report/coble_references.bib
link-citations: true
number-sections: true
crossref:
  chapters: true
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    html-math-method: mathjax
    code-copy: true
    smooth-scroll: true
    css: tikz-diagrams.css
    include-in-header: .assets/mathjax-order.html
    include-before-body: .assets/mathjax-macros.html
# Quarto resolves a project-relative path against this directory, but pandoc runs
# with its working directory at the *real* location of the input, and the parts are
# symlinked in from writing/ -- so every such path lands one level above this
# directory, whatever the input's depth. Two consequences, both load-bearing:
#
#   * Filters are named, never given as a path. A bare `*.lua` path misses by that
#     hop; an extension filter is resolved by name and is immune, so the two local
#     filters are packaged under _extensions/local/.
#   * Anything pandoc itself opens (the bibliographies, the header includes) lives
#     in .assets/, which is physically writing/.assets and reached from here through
#     a symlink. Both tools then find it: Quarto through the symlink, pandoc at the
#     place its relative path actually lands. Quarto-side assets such as the
#     stylesheet need none of this and stay beside this file.
filters:
  - book-toc
  - custom-numbered-blocks
  - stacks-tags
  - pandoc-tikzcd
  - tikz
tikz:
  cache: true
  svg-engine: pdftocairo
# Numbered amsthm-style environments (ute/custom-numbered-blocks).
# One shared per-chapter counter (all kinds in group 'blocks') -> a block is 'Kind N.M' in one sequence;
# quartothmlike appearance mimics native Quarto theorems.
# Author: ::: {.Warning #w-foo}\n### Optional title\n... :::   Reference: \ref{w-foo} -> '2.9', \longref{w-foo} -> 'Warning 2.9'.
# CONSTRAINT: labels must NOT start with Quarto-reserved prefixes (def- thm- lem- cor- prp- cnj- exm- exr- fig- tbl- eq- sec- lst-);
# Quarto would hijack them. The Coble part uses colon-separated ids (def:foo, thm:bar), which are not reserved.
custom-numbered-blocks:
  appearances:
    thmlike:
      container: quartothmlike
  groups:
    blocks:
      appearance: thmlike
  classes:
    Theorem:
      group: blocks
    Lemma:
      group: blocks
    Corollary:
      group: blocks
    Proposition:
      group: blocks
    Conjecture:
      group: blocks
    Definition:
      group: blocks
    Example:
      group: blocks
    Construction:
      group: blocks
    Notation:
      group: blocks
    Convention:
      group: blocks
    Exercise:
      group: blocks
    Problem:
      group: blocks
    Question:
      group: blocks
    Remark:
      group: blocks
    Warning:
      group: blocks
    Observation:
      group: blocks
    Note:
      group: blocks
    Claim:
      group: blocks
