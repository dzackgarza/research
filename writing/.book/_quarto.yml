# This directory is the Quarto project root and holds nothing but build
# machinery. The prose lives one level up in writing/; each part of the book is
# symlinked in beside this file (index.md, category-theory, coble, data), so
# `ls writing/.book` is the book's table of contents at the directory level.
# The writing that is not site content -- the dissertation, which builds through
# ~/.pandoc, plus the talks, exams and research statement -- is simply not
# linked in, which is why no render-exclusion list appears below.
project:
  type: book
  output-dir: _site
  # `resources:` is unused here. A directory entry is collected by a walk that does not
  # descend a symlink, and every part reaches this directory as one, so it silently
  # copies nothing; a single file that is itself a symlink is copied *as a symlink*,
  # which lands dangling in _site and then collides with itself on the second render
  # pass. Everything the site needs is copied by the post-render step instead.
  post-render:
    - .assets/copy-resources.sh
book:
  title: Writing
  repo-url: https://github.com/dzackgarza/research
  site-url: https://dzackgarza.github.io/research/
  search: true
  sidebar:
    collapse-level: 1
  # Two levels is all a book sidebar has: parts, then chapters. A nested `part:`
  # fails schema validation and `book.sidebar.contents` is accepted and then
  # ignored -- see TRAPS.md. So the parts below carry the whole tree, and each one
  # is a run the part's own landing page already names.
  #
  # This list is the book's reading order, and it is the only place that order is
  # written down. A chapter's position is a claim about its mathematics: that
  # everything it uses is defined above it, and that the part it sits in names the
  # subject it is about. So a new page is placed by reading it -- never by
  # appending to a part or inserting beside a similar filename. Filename order is
  # unrelated to dependency order, and here it once produced the exact reverse of
  # it. See writing/coble/AGENTS.md, "Where a new chapter goes".
  chapters:
    - index.md
    # Part 1. The landing page heads its own first group. Order is
    # definition-before-use: classifiers are needed by both limits and monoidal
    # structure, so truncation precedes them.
    - part: category-theory.md
      chapters:
        - Higher-Categories-and-Universes.md
        - Categorical-Foundations.md
        - Truncation-and-Classifiers.md
        - Limits-and-Colimits.md
        - Loops-and-Suspension.md
        - Identification.md
        - Equality.md
    - part: Algebraic structure
      chapters:
        - Mathematical-Framework.md
        - Monoidal-Categories.md
        - Modules-and-Forms.md
        - Generators-and-Presentations.md
        - Joins-Meets-and-Closure.md
        - Distinguished-Functors.md
        - Elements-and-Containment.md
        - Generic-Elements.md
    # One dependency chain, in its own order: a form, then a lattice, then the
    # Witt class, then the stable category the Witt class lives in, then the
    # morphisms and complexes built on that category.
    - part: Forms, lattices, and Witt theory
      chapters:
        - Bilinear-and-Quadratic-Forms.md
        - Bilinear-Forms-on-Algebra-Modules.md
        - Lattices-and-Discriminant-Forms.md
        - Isometries-and-Arithmetic-Invariants.md
        - Coxeter-Systems-and-Lattices.md
        - Hyperbolic-Forms-and-Witt-Classes.md
        - Stable-Categories-of-Modules-with-Duality.md
        - Morphisms-of-Form-Modules.md
        - Chain-Complexes.md
    - part: Authoring and reference
      chapters:
        - Mathematical-Language-Style-Guide.md
        - Mathematical-Sources.md
    # Part 2. The geometry the paper starts from: the three surface classes, then
    # the K3 cover that carries every lattice-theoretic statement later.
    - part: coble.md
      chapters:
        - 000-introduction.md
        - surface-types.md
        - k3-covers-and-involutions.md
        - polarizations-and-loci.md
        - coble-surface-basics.md
        - k3-covers-of-coble-surfaces.md
        - coble-surface-structure-and-classification.md
        - rational-sextic-calculations.md
    # General lattice machinery, complete before any Coble-specific lattice is
    # named. Splitting this from the next part is what keeps either readable.
    - part: Lattice theory
      chapters:
        - lattice-theory.md
        - root-systems.md
        - discriminant-forms-and-genus.md
        - embeddings-and-overlattices.md
        - special-lattices.md
        - invariant-and-coinvariant-lattices.md
    # This project's own arithmetic, in dependency order: the discriminant orbits
    # are what the Heegner line is cut out of, and the lifting criterion is stated
    # for the arithmetic group that chapter constructs.
    - part: The Coble lattice
      chapters:
        - discriminant-orbits-of-the-coble-lattice.md
        - the-heegner-line-and-the-coble-arithmetic-group.md
        - automorphism-lifting-through-a-gluing.md
        - coble-lattice-table.md
        - nodal-enriques-lattices.md
    - part: Moduli spaces and period domains
      chapters:
        - coble-moduli-basics.md
        - moduli-construction.md
        - lattices.md
    - part: Reflection groups and compactifications
      chapters:
        - reflection-groups-and-vinberg.md
        - coxeter-systems-and-classification.md
        - dynkin-foldings.md
        - hyperbolic-coxeter-polytopes.md
        - reflective-two-elementary-lattices.md
        - toroidal-and-semitoroidal.md
        - scattone-cusp-method.md
    - part: Degenerations
      chapters:
        - kulikov-models.md
        - anticanonical-pairs-and-singularities.md
        - divisor-and-dlt-models.md
        - halphen-surfaces.md
        - morrison-flowerpot-degenerations.md
    # Enriques first: the Coble diagram is obtained from it by mirror moves, and
    # the correspondence chapter runs in that direction too.
    - part: The cusp correspondence
      chapters:
        - cusp-diagram-calculations.md
        - enriques-surface-cusps.md
        - coble-surface-cusps.md
        - sterk-cusp-divisibilities.md
        - enriques-to-coble-cusp-correspondence.md
    - part: Stable limits
      chapters:
        - geometric.md
        - ias.md
        - ksba.md
    - part: 'Results for $F_{\mathrm{En},2}$'
      chapters:
        - main-theorem-and-cusps.md
        - ksba-semitoroidal-comparison.md
        - classifying-map-and-involution.md
    # The split below is the one the pages declare themselves, in their own
    # `unit:` frontmatter: reusable method, then the results it produced.
    - part: Computational methods
      chapters:
        - computational-toolchain-and-recipe.md
        - lattice-algorithms-by-signature.md
        - fundamental-chamber-polyhedra.md
        - isotropic-orbits-and-tits-buildings.md
        - periods-and-local-monodromy.md
    - part: Computed results
      chapters:
        - coxiter-results-for-cusp-lattices.md
        - root-vectors-and-folded-sterk-diagrams.md
        - sterk-root-counts-and-computed-chambers.md
        - sterk-integral-affine-data.md
        - coble-lattice-isotropic-candidates.md
    # Everything still conjectural, together: the pages below all carry
    # `status: conjectural`, and a reader is owed that boundary in the structure.
    - part: Open problems and research programs
      chapters:
        - open-problems.md
        - coble-families-research-program.md
        - cusp-correspondence-morphism-chain.md
        - nodal-enriques-moduli-program.md
        - halphen-index-2-moduli-program.md
        - coble-heegner-research-report.md
    # Back matter. coble/tables/*.md are untitled fragments, not chapters: they
    # are pulled into the Diagrams page by include, which is why they no longer
    # appear as blank entries in the sidebar.
    - part: Reference
      chapters:
        - adjunction-and-ramification-formulae.md
        - coxeter-and-dynkin-diagrams.md
        - lattice-and-diagram-conventions.md
        - extracted-references.md
# Assets that pandoc, rather than Quarto, opens must live in .assets/ -- see the
# note beside `filters:` below. The two Coble bibliographies need no such
# treatment: they sit inside a symlinked part, so both tools reach them the same way.
bibliography:
  - .assets/references.bib
  - .assets/refs-web.bib
  - coble/coble_supplement.bib
  - coble/heegner-report/coble_references.bib
link-citations: true
number-sections: true
crossref:
  chapters: true
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    html-math-method: mathjax
    code-copy: true
    smooth-scroll: true
    css: tikz-diagrams.css
    include-in-header: .assets/mathjax-order.html
    include-before-body: .assets/mathjax-macros.html
# Quarto resolves a project-relative path against this directory, but pandoc runs
# with its working directory at the *real* location of the input, and the parts are
# symlinked in from writing/ -- so every such path lands one level above this
# directory, whatever the input's depth. Two consequences, both load-bearing:
#
#   * Filters are named, never given as a path. A bare `*.lua` path misses by that
#     hop; an extension filter is resolved by name and is immune, so the two local
#     filters are packaged under _extensions/local/.
#   * Anything pandoc itself opens (the bibliographies, the header includes) lives
#     in .assets/, which is physically writing/.assets and reached from here through
#     a symlink. Both tools then find it: Quarto through the symlink, pandoc at the
#     place its relative path actually lands. Quarto-side assets such as the
#     stylesheet need none of this and stay beside this file.
filters:
  - book-toc
  - custom-numbered-blocks
  - stacks-tags
  - pandoc-tikzcd
  - tikz
tikz:
  cache: true
  svg-engine: pdftocairo
# Numbered amsthm-style environments (ute/custom-numbered-blocks).
# One shared per-chapter counter (all kinds in group 'blocks') -> a block is 'Kind N.M' in one sequence;
# quartothmlike appearance mimics native Quarto theorems.
# Author: ::: {.Warning #w-foo}\n### Optional title\n... :::   Reference: \ref{w-foo} -> '2.9', \longref{w-foo} -> 'Warning 2.9'.
# CONSTRAINT: labels must NOT start with Quarto-reserved prefixes (def- thm- lem- cor- prp- cnj- exm- exr- fig- tbl- eq- sec- lst-);
# Quarto would hijack them. The Coble part uses colon-separated ids (def:foo, thm:bar), which are not reserved.
custom-numbered-blocks:
  appearances:
    thmlike:
      container: quartothmlike
  groups:
    blocks:
      appearance: thmlike
  classes:
    Theorem:
      group: blocks
    Lemma:
      group: blocks
    Corollary:
      group: blocks
    Proposition:
      group: blocks
    Conjecture:
      group: blocks
    Definition:
      group: blocks
    Example:
      group: blocks
    Construction:
      group: blocks
    Notation:
      group: blocks
    Convention:
      group: blocks
    Exercise:
      group: blocks
    Problem:
      group: blocks
    Question:
      group: blocks
    Remark:
      group: blocks
    Warning:
      group: blocks
    Observation:
      group: blocks
    Note:
      group: blocks
    Claim:
      group: blocks
