bibliography:
  - .assets/references.bib
  - .assets/refs-web.bib
  - coble/coble_supplement.bib
  - coble/heegner-report/coble_references.bib
link-citations: true
number-sections: true
crossref:
  chapters: true
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    html-math-method: mathjax
    code-copy: true
    smooth-scroll: true
    css: tikz-diagrams.css
    include-in-header: .assets/mathjax-order.html
    include-before-body: .assets/mathjax-macros.html
filters:
  - book-toc
  - amsthm-refs
  - amsthm-divs
  - custom-numbered-blocks
  - stacks-tags
  - pandoc-tikzcd
  - tikz
tikz:
  cache: true
  svg-engine: pdftocairo
custom-numbered-blocks:
  appearances:
    thmlike:
      container: quartothmlike
  groups:
    blocks:
      appearance: thmlike
  classes:
    theorem:
      group: blocks
      label: Theorem
      listin:
        - results
    lemma:
      group: blocks
      label: Lemma
      listin:
        - results
    corollary:
      group: blocks
      label: Corollary
      listin:
        - results
    proposition:
      group: blocks
      label: Proposition
      listin:
        - results
    conjecture:
      group: blocks
      label: Conjecture
      listin:
        - results
        - outstanding-work
    definition:
      group: blocks
      label: Definition
      listin:
        - definitions
    example:
      group: blocks
      label: Example
    construction:
      group: blocks
      label: Construction
      listin:
        - definitions
    notation:
      group: blocks
      label: Notation
      listin:
        - definitions
    convention:
      group: blocks
      label: Convention
      listin:
        - definitions
    exercise:
      group: blocks
      label: Exercise
    problem:
      group: blocks
      label: Problem
    question:
      group: blocks
      label: Question
      listin:
        - outstanding-work
    remark:
      group: blocks
      label: Remark
    warning:
      group: blocks
      label: Warning
    observation:
      group: blocks
      label: Observation
    note:
      group: blocks
      label: Note
    claim:
      group: blocks
      label: Claim
    assumption:
      group: blocks
      label: Assumption
