# This directory is the Quarto project root and holds nothing but build
# machinery. The prose lives one level up in writing/; each part of the book is
# symlinked in beside this file (index.md, category-theory, coble, data), so
# `ls writing/.book` is the book's table of contents at the directory level.
# The writing that is not site content -- the dissertation, which builds through
# ~/.pandoc, plus the talks, exams and research statement -- is simply not
# linked in, which is why no render-exclusion list appears below.
project:
  type: book
  output-dir: _site
  # Only single files can be listed here. A directory, with or without a glob, is
  # collected by a walk that does not descend a symlink, and every part reaches this
  # directory as one -- so a directory entry silently copies nothing. The resource
  # trees are copied by the post-render step instead.
  resources:
    - category-theory/lean/category-graph.html
    - category-theory/lean/category-graph.dot
  post-render:
    - .assets/copy-resources.sh
book:
  title: Writing
  repo-url: https://github.com/dzackgarza/research
  site-url: https://dzackgarza.github.io/research/
  search: true
  sidebar:
    collapse-level: 1
  chapters:
    - index.md
