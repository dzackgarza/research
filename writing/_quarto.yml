format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    html-math-method: mathjax
    code-copy: true
    smooth-scroll: true
    css: tikz-diagrams.css
    include-before-body: _mathjax-macros.html
filters:
  - book-toc
  - custom-numbered-blocks
  - stacks-tags.lua
  - pandoc-tikzcd.lua
  - tikz
tikz:
  cache: true
  svg-engine: pdftocairo
# Numbered amsthm-style environments (ute/custom-numbered-blocks).
# One shared per-chapter counter (all kinds in group 'blocks') -> a block is 'Kind N.M' in one sequence;
# quartothmlike appearance mimics native Quarto theorems.
# Author: ::: {.Warning #w-foo}\n### Optional title\n... :::   Reference: \ref{w-foo} -> '2.9', \longref{w-foo} -> 'Warning 2.9'.
# CONSTRAINT: labels must NOT start with Quarto-reserved prefixes (def- thm- lem- cor- prp- cnj- exm- exr- fig- tbl- eq- sec- lst-);
# Quarto would hijack them. The Coble part uses colon-separated ids (def:foo, thm:bar), which are not reserved.
custom-numbered-blocks:
  appearances:
    thmlike:
      container: quartothmlike
  groups:
    blocks:
      appearance: thmlike
  classes:
    Theorem:
      group: blocks
    Lemma:
      group: blocks
    Corollary:
      group: blocks
    Proposition:
      group: blocks
    Conjecture:
      group: blocks
    Definition:
      group: blocks
    Example:
      group: blocks
    Construction:
      group: blocks
    Notation:
      group: blocks
    Convention:
      group: blocks
    Exercise:
      group: blocks
    Problem:
      group: blocks
    Question:
      group: blocks
    Remark:
      group: blocks
    Warning:
      group: blocks
    Observation:
      group: blocks
    Note:
      group: blocks
    Claim:
      group: blocks
