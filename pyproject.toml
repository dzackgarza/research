[project]
name = "dzack-research"
version = "0.1.1"
requires-python = ">=3.14"
dependencies = [
    "haystack-ai>=2.31.0",
    "pandoc-config @ git+https://github.com/dzackgarza/pandoc-config",
    "python-dotenv>=1.2.2",
    "sage-julia-bridge @ git+https://github.com/dzackgarza/sage-julia-bridge",
    "sage-categories",
    "sage-extensions @ git+https://github.com/dzackgarza/sage-extensions",
    "streamlit>=1.59.2",
    "tree-sitter-sage",
    "vinal @ git+https://github.com/dzackgarza/vinal",
    "z3-solver>=4.16.0.0",
    "python-flint>=0.9",
    "python-frontmatter>=1.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dzack_research = ["py.typed"]

# Fetched from its repository, not a sibling directory. A relative path here
# is inherited by every consumer that fetches this project from git, where it
# resolves against the wrong root -- uv rewrites it as a subdirectory of this
# repo, which does not exist. The Sage fork's research-environment reinstalls
# local checkouts over the resolved copies, so editing stays live.
[tool.uv.sources]
sage-stubs = { git = "https://github.com/dzackgarza/sage-stubs.git" }
tree-sitter-sage = { git = "https://github.com/dzackgarza/tree-sitter-sage" }
sage-categories = { git = "https://github.com/dzackgarza/sage-categories.git" }

# The category packages sage-mypy-category-plugin projects for the Sage QC
# tier's mypy run: the preamble's categories, built through Sage's runtime.
[tool.sage-mypy-category-plugin]
packages = ["sage_extensions"]

[tool.pytest.ini_options]
# The archived preamble is source evidence, not an executable test tree.
# Bare pytest invocations collect the live suite only; an archive path may still
# be named explicitly when inspecting historical material. The mathematics
# tests live with their code in sage-extensions; these test the research
# tooling.
testpaths = ["tests"]
# Every run says where its wall time went and leaves a machine-readable record.
#
# --timeout bounds one test: a test that blocks -- on a subprocess, a lock, a
# network call -- burns wall clock at low CPU and reports nothing at all when
# it is killed.  On timeout pytest-timeout dumps the stack of every thread,
# which names the blocking call instead of leaving it to bisection.
# --durations ranks test phases, pytest-durations aggregates them by file, and
# the report log plus JUnit xml make runs comparable to each other.
addopts = """
  --timeout=60 --timeout-method=signal
  --durations=0 --durations-min=0
  --junit-xml=tests/.report/junit.xml
  --report-log=tests/.report/run.jsonl
"""
log_cli = false
log_file = "tests/.report/pytest.log"
log_file_level = "DEBUG"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "hypothesis>=6.167.1",
    "ipython>=9.16.1",
    "pytest-cov>=7.0",
    "pytest-reportlog>=1.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8",
    "sage-stubs @ git+https://github.com/dzackgarza/sage-stubs.git",
]
