[project]
name = "dzack-research"
version = "0.1.1"
requires-python = ">=3.14"
dependencies = [
    "haystack-ai>=2.31.0",
    "pandoc-config @ https://github.com/dzackgarza/pandoc-config/archive/b567314b56b11326fdba05041afdccd11adee5b3.tar.gz",
    "python-dotenv>=1.2.2",
    "sage-julia-bridge @ git+https://github.com/dzackgarza/sage-julia-bridge",
    "streamlit>=1.59.2",
    "tree-sitter-sage",
    "vinal @ git+https://github.com/dzackgarza/vinal",
    "z3-solver>=4.16.0.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dzack_research = ["py.typed"]

# Fetched from its repository, not a sibling directory. A relative path here
# is inherited by every consumer that fetches this project from git, where it
# resolves against the wrong root -- uv rewrites it as a subdirectory of this
# repo, which does not exist. The Sage fork's research-environment reinstalls
# local checkouts over the resolved copies, so editing stays live.
[tool.uv.sources]
sage-stubs = { git = "https://github.com/dzackgarza/sage-stubs.git" }
tree-sitter-sage = { git = "https://github.com/dzackgarza/tree-sitter-sage" }


[tool.pytest.ini_options]
# Every run says where its wall time went and leaves a machine-readable record.
#
# --timeout is the important one: a suite that blocks -- on a subprocess, a
# lock, a network call -- burns wall clock at low CPU and reports nothing at
# all when it is killed.  On timeout pytest-timeout dumps the stack of every
# thread, which names the blocking call instead of leaving it to bisection.
# --durations ranks test phases, pytest-durations aggregates them by file, and
# the report log plus JUnit xml make runs comparable to each other.
addopts = """
  --timeout=90 --timeout-method=signal
  --durations=0 --durations-min=0
  --junit-xml=tests/.report/junit.xml
  --report-log=tests/.report/run.jsonl
"""
log_cli = false
log_file = "tests/.report/pytest.log"
log_file_level = "DEBUG"

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "sage-stubs @ git+https://github.com/dzackgarza/sage-stubs.git",
]
