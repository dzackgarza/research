name: docs
'on':
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Provision shared Pandoc filters
        run: git clone --depth 1 https://github.com/dzackgarza/pandoc-config "$HOME/.pandoc"
      - name: Install TikZ rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pdf2svg poppler-utils
          tlmgr install \
            bookmark \
            centernot \
            dynkin-diagrams \
            enumitem \
            esint \
            import \
            mathrsfs \
            mathtools \
            microtype \
            pgfplots \
            slashed \
            standalone \
            stmaryrd \
            subcaption \
            tikz-cd \
            was \
            xypic
      - name: Fetch shared bibliography
        run: curl -sSL https://raw.githubusercontent.com/dzackgarza/pandoc-config/main/bib/references.bib
          -o docs/references.bib
      - run: python3 scripts/docs_check.py
        name: Render + integrity gate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
