name: docs
'on':
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      - name: Provision shared Pandoc filters
        run: git clone --depth 1 https://github.com/dzackgarza/pandoc-config "$HOME/.pandoc"
      - name: Install TikZ rendering dependencies
        # texlive-full, the same TeX the figures are authored against locally.
        # A partial install diverges the moment a figure reaches for a package
        # nobody listed.
        run: |
          sudo apt-get update
          sudo apt-get install --yes pdf2svg poppler-utils texlive-full
      - name: Fetch shared bibliography
        run: curl -sSL https://raw.githubusercontent.com/dzackgarza/pandoc-config/main/bib/references.bib
          -o docs/references.bib
      - name: Fetch shared MathJax macros
        run: cp "$HOME/.pandoc/templates/css/mathjax-macros.html" docs/_mathjax-macros.html
      - run: python3 scripts/docs_check.py
        name: Render + integrity gate
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
