name: docs
'on':
  push:
    branches:
      - main
    paths:
      - writing/**
      # The build machinery sits in dot directories, which `writing/**` may not match.
      - writing/.book/**
      - writing/.assets/**
      - scripts/**
      - .github/workflows/docs.yml
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # The research image carries the document toolchain this build runs on --
    # quarto, TeX Live, pdf2svg and poppler (dzackgarza/sage#22) -- so the job
    # installs none of it.
    container: ghcr.io/dzackgarza/sage:develop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Provision shared Pandoc filters
        run: |
          git clone --depth 1 https://github.com/dzackgarza/pandoc-config "$HOME/.pandoc"
      - name: Fetch shared bibliography and MathJax macros
        # From the pandoc-config clone above, the same way `just docs-assets`
        # takes them from ~/.pandoc. Fetching the bib over raw.githubusercontent
        # instead let CI read a different revision than the filters beside it.
        run: |
          cp "$HOME/.pandoc/bib/references.bib" writing/.assets/references.bib
          cp "$HOME/.pandoc/templates/css/mathjax-macros.html" writing/.assets/mathjax-macros.html
          python3 scripts/docs_figures.py
      - run: python3 scripts/docs_check.py
        name: Render + integrity gate
        # The image carries quarto, so the gate's command is the bare name.
        env:
          QUARTO: quarto
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: writing/.book/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    container: ghcr.io/dzackgarza/sage:develop
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
