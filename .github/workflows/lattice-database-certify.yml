name: lattice-database-certify
'on':
  schedule:
  - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      tag:
        description: 'Certify one lattice tag while debugging this workflow; omit for the full corpus.'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: lattice-database-certify
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: lattice-database
        shell: bash -el {0}
    steps:
    - name: Check out (actions/checkout v4)
      id: checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: main
    - name: Start the canonical research Sage environment
      working-directory: ${{ github.workspace }}
      run: |
        docker run --detach --name sage-env \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          --workdir "$GITHUB_WORKSPACE" \
          ghcr.io/dzackgarza/sage:develop sleep infinity
        docker exec -i -w "$GITHUB_WORKSPACE" sage-env \
          /sage/.venv/bin/python -c \
          'import sys, sage.version; assert sys.version_info >= (3, 14); print(sys.version); print(sage.version.version)'
    - name: Install current research and lattice database checkouts
      working-directory: ${{ github.workspace }}
      run: |
        docker exec -i -w "$GITHUB_WORKSPACE" sage-env \
          /sage/.venv/bin/uv pip install --python /sage/.venv/bin/python --no-deps --editable "$GITHUB_WORKSPACE"
        docker exec -i -w "$GITHUB_WORKSPACE/lattice-database" sage-env \
          /sage/.venv/bin/uv pip install --python /sage/.venv/bin/python --editable . pytest
    - name: Compute and certify uncertified card values
      env:
        LATTICEDB_TAG: ${{ github.event.inputs.tag || '' }}
      run: |
        args=(--seconds 600)
        if [[ -n "$LATTICEDB_TAG" ]]; then
          args+=(--tag "$LATTICEDB_TAG")
        fi
        timeout 330m docker exec -i \
          --env "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/lattice-database/src" \
          --workdir "$GITHUB_WORKSPACE/lattice-database" \
          sage-env /sage/.venv/bin/python -m latticedb certify "${args[@]}"
    - name: Commit completed computations to main
      if: ${{ always() && steps.checkout.outcome == 'success' }}
      working-directory: ${{ github.workspace }}
      shell: bash --noprofile --norc -e -o pipefail {0}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git add lattice-database/lattices lattice-database/certificates.yaml
        if git diff --cached --quiet; then
          echo "No newly completed computations."
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'feat(lattice-database): certify computed card values'

        staging_branch="lattice-database/certify-${GITHUB_RUN_ID}"
        git push origin "HEAD:refs/heads/${staging_branch}"

        for attempt in 1 2 3 4 5; do
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Computed values conflict with current main; durable result remains on ${staging_branch}."
            exit 1
          fi
          if git push origin HEAD:main; then
            git push origin --delete "${staging_branch}"
            exit 0
          fi
          echo "main advanced during push attempt ${attempt}; rebasing and retrying."
        done

        echo "::error::Could not integrate computed values into main after 5 attempts; durable result remains on ${staging_branch}."
        exit 1
    - name: Stop the Sage environment
      if: always()
      working-directory: ${{ github.workspace }}
      shell: bash --noprofile --norc -e -o pipefail {0}
      run: docker rm --force sage-env >/dev/null 2>&1 || true
