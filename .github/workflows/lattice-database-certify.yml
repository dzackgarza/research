name: lattice-database-certify
'on':
  schedule:
  - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      tag:
        description: 'Certify one lattice tag while debugging this workflow; omit for the full corpus.'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: lattice-database-certify
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: sagemath/sagemath:latest
      options: --user root
    defaults:
      run:
        working-directory: lattice-database
        shell: bash
    steps:
    - name: Install Git in the SageMath container
      working-directory: /
      run: |
        apt-get update
        apt-get install --yes --no-install-recommends git
    - name: Check out (actions/checkout v4)
      id: checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: main
    - name: Install uv (astral-sh/setup-uv v10.2.0)
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: false
    - name: Locate SageMath
      run: |
        sage_bin=$(command -v sage)
        sage_python=$("$sage_bin" -c 'import sys; print(sys.executable)')
        echo "SAGE_BIN=$sage_bin" >> "$GITHUB_ENV"
        echo "SAGE_PYTHON=$sage_python" >> "$GITHUB_ENV"
    - name: Install lattice database dependencies into SageMath
      run: |
        uv pip install --python "$SAGE_PYTHON" +          'pydantic>=2.11' +          'pyyaml>=6.0' +          'python-frontmatter>=1.1' +          'jinja2>=3.1' +          'cyclopts>=3' +          'markdown-it-py>=4.2.0' +          'pytest>=8'
        "$SAGE_PYTHON" -c 'import cypari2, flint, frontmatter, jinja2, markdown_it, pydantic, yaml'
    - name: Compute and certify uncertified card values
      env:
        LATTICEDB_TAG: ${{ github.event.inputs.tag || '' }}
      run: |
        args=(--seconds 600)
        if [[ -n "$LATTICEDB_TAG" ]]; then
          args+=(--tag "$LATTICEDB_TAG")
        fi
        timeout 330m env PYTHONPATH="../src:src" "$SAGE_PYTHON" -m latticedb certify "${args[@]}"
    - name: Commit completed computations to main
      if: ${{ always() && steps.checkout.outcome == 'success' }}
      working-directory: ${{ github.workspace }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git add lattice-database/lattices lattice-database/certificates.yaml
        if git diff --cached --quiet; then
          echo "No newly completed computations."
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'feat(lattice-database): certify computed card values'

        staging_branch="lattice-database/certify-${GITHUB_RUN_ID}"
        git push origin "HEAD:refs/heads/${staging_branch}"

        for attempt in 1 2 3 4 5; do
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Computed values conflict with current main; durable result remains on ${staging_branch}."
            exit 1
          fi
          if git push origin HEAD:main; then
            git push origin --delete "${staging_branch}"
            exit 0
          fi
          echo "main advanced during push attempt ${attempt}; rebasing and retrying."
        done

        echo "::error::Could not integrate computed values into main after 5 attempts; durable result remains on ${staging_branch}."
        exit 1
