name: lattice-database-certify
'on':
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch: null
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: lattice-database-certify
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: sagemath/sagemath:latest
      options: --user root
    defaults:
      run:
        working-directory: lattice-database
        shell: bash
    steps:
      - name: Check out (actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv (astral-sh/setup-uv v10.2.0)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Locate SageMath
        run: |
          sage_bin=$(command -v sage)
          echo "SAGE_BIN=$sage_bin" >> "$GITHUB_ENV"
      - name: Carry out the computations without a certificate
        run: timeout 330m uv run latticedb certify --seconds 600
      - name: Open a pull request with the new values and certificates (peter-evans/create-pull-request v8.1.1)
        if: always()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: lattice-database/certify
          add-paths: 'lattice-database/lattices

            lattice-database/certificates.yaml'
          commit-message: 'feat(lattice-database): values and certificates of the nightly certify run'
          title: 'lattice-database: values and certificates of the nightly certify run'
          body: The values that `latticedb certify` computed, and their certificates in `certificates.yaml`. A failed job lists in its log the stored values that differ from the computed ones.
