name: lattice-database-certify
'on':
  schedule:
  - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      tag:
        description: 'Certify one lattice tag while debugging this workflow; omit for the full corpus.'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: lattice-database-certify
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: lattice-database
        shell: bash -el {0}
    steps:
    - name: Check out (actions/checkout v4)
      id: checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: main
    - name: Provision SageMath on Python 3.14
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        environment-name: research-ci
        create-args: >-
          python=3.14
          sage=10.9
          pip
        cache-environment: true
        cache-downloads: true
    - name: Install uv (astral-sh/setup-uv v10.2.0)
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: false
    - name: Install lattice database in the SageMath environment
      run: |
        uv pip install --python "$(command -v python)" -e . pytest
        python -c 'import sys, sage.all; assert sys.version_info >= (3, 14); print(sys.version)'
    - name: Compute and certify uncertified card values
      env:
        LATTICEDB_TAG: ${{ github.event.inputs.tag || '' }}
      run: |
        args=(--seconds 600)
        if [[ -n "$LATTICEDB_TAG" ]]; then
          args+=(--tag "$LATTICEDB_TAG")
        fi
        timeout 330m env PYTHONPATH="../src:src" python -m latticedb certify "${args[@]}"
    - name: Commit completed computations to main
      if: ${{ always() && steps.checkout.outcome == 'success' }}
      working-directory: ${{ github.workspace }}
      shell: bash --noprofile --norc -e -o pipefail {0}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git add lattice-database/lattices lattice-database/certificates.yaml
        if git diff --cached --quiet; then
          echo "No newly completed computations."
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'feat(lattice-database): certify computed card values'

        staging_branch="lattice-database/certify-${GITHUB_RUN_ID}"
        git push origin "HEAD:refs/heads/${staging_branch}"

        for attempt in 1 2 3 4 5; do
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Computed values conflict with current main; durable result remains on ${staging_branch}."
            exit 1
          fi
          if git push origin HEAD:main; then
            git push origin --delete "${staging_branch}"
            exit 0
          fi
          echo "main advanced during push attempt ${attempt}; rebasing and retrying."
        done

        echo "::error::Could not integrate computed values into main after 5 attempts; durable result remains on ${staging_branch}."
        exit 1
