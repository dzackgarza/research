name: Cat construction runtime acceptance

on:
  push:
    branches:
      - main
    paths:
      - 'tests/constructions/test_cat_methods_construct.sage'
      - 'tests/constructions/test_categorical_constructions_construct.sage'
      - '.github/workflows/cat-runtime-acceptance.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'tests/constructions/test_cat_methods_construct.sage'
      - 'tests/constructions/test_categorical_constructions_construct.sage'
      - '.github/workflows/cat-runtime-acceptance.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cat-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/dzackgarza/sage:develop
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve the Sage launcher from the image
        run: |
          sage_bin="${SAGE_BIN:-/usr/bin/sage}"
          if [ ! -x "$sage_bin" ]; then
            echo "Sage launcher is not executable: $sage_bin" >&2
            printf 'HOME=%s\nPATH=%s\n' "$HOME" "$PATH" >&2
            command -v sage >&2 || true
            exit 1
          fi
          echo "SAGE_BIN=$sage_bin" >> "$GITHUB_ENV"
          "$sage_bin" --version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install the Sage runtime dependencies
        run: |
          echo 'export DIRENV_CONFIGURED_CORRECTLY=1' > "$HOME/.envrc"
          set -a
          source .envrc
          set +a
          mkdir -p "$TMPDIR"
          sage_python="$("$SAGE_BIN" -c 'import sys; print(sys.executable)')"
          uv pip install --python "$sage_python" --editable . pytest pytest-timeout pytest-reportlog
          uv pip install --python "$sage_python" --reinstall \
            'sage-extensions @ git+https://github.com/dzackgarza/sage-extensions@230bdf903d2968e531d26cb5d5a9d6420b734124'
      - name: Install the Sage pytest plugins
        run: git clone --depth 1 https://github.com/dzackgarza/ai-review-ci.git "$HOME/ai-review-ci"
      - name: Execute the original Cat construction specimens
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/computations/experiments:${{ github.workspace }}/computations/archives:${{ github.workspace }}/tests/constructions
        run: |
          echo 'export DIRENV_CONFIGURED_CORRECTLY=1' > "$HOME/.envrc"
          set -a
          source .envrc
          set +a
          export PYTHONPATH="$HOME/ai-review-ci/tool-artifacts/pytest_plugins:$PYTHONPATH"
          mkdir -p "$TMPDIR" tests/.report .ai-review-ci/sage/pytest-history
          sage_python="$("$SAGE_BIN" -c 'import sys; print(sys.executable)')"
          export PATH="$(dirname "$sage_python"):$PATH"
          "$sage_python" -c 'import sage.all, sys, pytest; sys.exit(pytest.main(sys.argv[1:]))' \
            -p qc_sage_session -p qc_xfail_issues -p qc_test_history -p qc_unique_inventory \
            --qc-history-dir .ai-review-ci/sage/pytest-history \
            -s --timeout=30 \
            -k 'test_all_twenty_one_construction_accessors_are_owned_by_cat or test_all_cat_construction_accessors_build_owned_categories' \
            tests/constructions/test_cat_methods_construct.sage \
            tests/constructions/test_categorical_constructions_construct.sage
