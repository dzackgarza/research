name: Coinvariant transport profile
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/dzackgarza/sage:develop
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install the Sage-side test dependencies and both exact checkouts
        env:
          SAGE_BIN: /sage/.venv/bin/sage
          PORT_REV: d9b04c748bd6433af1c549f5a1565ad6dd6a973e
        run: |
          set -euo pipefail
          test -x "$SAGE_BIN"
          echo "SAGE_BIN=$SAGE_BIN" >> "$GITHUB_ENV"
          sage_python="$($SAGE_BIN -python -c 'import sys; print(sys.executable)')"
          uv pip install --quiet --python "$sage_python" "pytest>=9.1,<10" pyyaml "hypothesis>=6.165,<7" pytest-shard pytest-instafail PyNormaliz
          uv pip install --quiet --python "$sage_python" "sage-julia-bridge @ git+https://github.com/dzackgarza/sage-julia-bridge"
          uv pip install --quiet --python "$sage_python" --no-deps --editable "$GITHUB_WORKSPACE"
          git clone --quiet https://github.com/dzackgarza/sage-indefinite-port "$RUNNER_TEMP/sage-indefinite-port"
          git -C "$RUNNER_TEMP/sage-indefinite-port" checkout --quiet "$PORT_REV"
          uv pip install --quiet --python "$sage_python" --no-deps --editable "$RUNNER_TEMP/sage-indefinite-port"
          echo "PORT_TEST_BOUNDARIES=$RUNNER_TEMP/sage-indefinite-port/tests/acceptance/test_boundaries.sage" >> "$GITHUB_ENV"
      - name: Profile small and frozen Enriques transports
        run: |
          set -o pipefail
          "$SAGE_BIN" -python scripts/profile_coinvariant_transport.py "$PORT_TEST_BOUNDARIES" 2>&1 | tee transport-profile.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinvariant-transport-profile
          path: transport-profile.log
