name: PR Review
# Quality review is explicitly re-enabled only in the stabilized phase.
on:
  workflow_dispatch: {}
jobs:
  deterministic-diff:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
    with:
      gate: deterministic-diff
      profile: 'sage'
  delegation-conformance:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
    with:
      gate: delegation-conformance
      profile: 'sage'
  qc-doctor:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      actions: read
      # Label-alignment check reads live labels via `gh label list`
      # (GET /repos/{owner}/{repo}/labels), which requires Issues (read).
      issues: read
    with:
      gate: qc-doctor
      profile: 'sage'
  pr-description-checklist:
    uses: dzackgarza/ai-review-ci/.github/workflows/_gates.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      gate: pr-description-checklist
      profile: 'sage'
