[build-system]
requires = ["hatchling>=1.5.0", "hatch-jupyter-builder>=0.5"]
build-backend = "hatchling.build"

[project]
name = "dzack_mathjax_extension"
version = "4.6.0.post1"
description = "Forked MathJax extension with configurable maxBuffer from live page config."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "jupyterlab>=4.0.0,<5"
]

[tool.hatch.build.targets.wheel]
artifacts = ["dzack_mathjax_extension/labextension"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "dzack_mathjax_extension/labextension/package.json"
]

[tool.hatch.build.hooks.jupyter-builder.npm-build-args]
build-cmd = "build"

[tool.hatch.build.hooks.jupyter-builder.options]
path = "."
editable_build_cmd = "build"

[tool.hatch.build.targets.wheel.shared-data]
"dzack_mathjax_extension/labextension" = "share/jupyter/labextensions/@dzack/mathjax-extension"
"install.json" = "share/jupyter/labextensions/@dzack/mathjax-extension/install.json"
